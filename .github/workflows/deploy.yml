name: Deploy Diabetes Prediction
on :
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: chechout code
        uses: actions/checkout@v4

      - name: login to Docker Hub
        uses: docker/login-action@v3
        with: 
          username: ${{secrets.DOCKERHUB_USERNAME}}
          password: ${{secrets.DOCKERHUB_TOKEN}}

      - name: Build Docker Image
        run: |
          docker build -t ${{secrets.DOCKERHUB_USERNAME}}/diabetes-prediction:latest .

      - name: Push Docker Image
        run: |
         docker push ${{secrets.DOCKERHUB_USERNAME}}/diabetes-prediction:latest

      - name: Deploy to EC2
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{secrets.EC2_HOST}}
          username: ubuntu
          key: ${{secrets.EC2_SSH_KEY}}
          script: |
            set -e
            sudo docker stop diabetes-prediction || true
            sudo docker rm diabetes-prediction || true
            sudo docker image prune -af
            sudo docker pull ${{secrets.DOCKERHUB_USERNAME}}/diabetes-prediction:latest
            sudo docker run -d -p 5000:5000 --name diabetes-prediction ${{secrets.DOCKERHUB_USERNAME}}/diabetes-prediction:latest
            